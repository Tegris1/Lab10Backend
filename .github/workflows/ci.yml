name: Lab 10 CI/CD

on:
  push:
    branches: [main, lab10]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_test:
        description: 'Rehearsal only: run an intentionally failing test to prove publication is blocked'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # A new main push must not interrupt an active migration/publication.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, tests, production build and basket E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shop_lab08_ci
          POSTGRES_USER: shop_lab08
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_lab08 -d shop_lab08_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # All values are fictional and scoped to this ephemeral PostgreSQL service.
    # PR code never receives production secrets or a production database URL.
    env:
      DATABASE_URL: postgresql://shop_lab08:ci-only-password@localhost:5432/shop_lab08_ci
      TEST_DATABASE_URL: postgresql://shop_lab08:ci-only-password@localhost:5432/shop_lab08_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-fictional-auth-secret-at-least-32-characters
      GITHUB_CLIENT_ID: fictional-ci-client-id
      GITHUB_CLIENT_SECRET: fictional-ci-client-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the locked dependencies
        run: npm ci --include=dev
      - name: Exercise a failed test in the publication-gate rehearsal
        if: github.event_name == 'workflow_dispatch' && inputs.fail_test
        run: npm run test:ci-gate:failure
      - name: Validate the Prisma schema
        run: npm run db:validate
      - name: Generate client, lint, test and build
        run: npm run ci:check
      - name: Locate Chrome for the basket browser test
        run: |
          browser_path="$(command -v google-chrome)"
          echo "BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Test the basket in a browser on an isolated database
        id: cart_e2e
        run: npm run test:e2e:cart
      - name: Upload basket browser test results
        if: always() && steps.cart_e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: cart-e2e-${{ github.sha }}
          path: .tools/cart-e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Record the verified revision
        if: success()
        run: |
          echo "Verified checkout: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Publication can proceed only after all checks, including basket E2E, pass." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Production publication
    needs: verify
    if: >-
      needs.verify.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'release-rehearsal' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the checked-out revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Record successful publication-gate rehearsal
        if: github.event_name == 'workflow_dispatch'
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          echo "Publication gate passed for SHA $VERIFIED_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "Manual rehearsal only: no Production credentials, migrations or deployment were used." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install release dependencies and pinned Vercel CLI
        if: github.event_name == 'push'
        run: |
          npm ci --include=dev
          npm install --global vercel@65.14.0 --no-audit --no-fund
      - name: Pull the existing Vercel Production configuration
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Validate release origin and direct migration connection
        if: github.event_name == 'push'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: npm run release:check
      - name: Build the verified revision with Production configuration
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Apply saved migrations separately from the application build
        if: github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: npm run db:migrate:deploy
      - name: Publish the verified prebuilt revision
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .tools/release
          vercel deploy --prebuilt --prod --yes --meta githubCommitSha="$GITHUB_SHA" --token="$VERCEL_TOKEN" > .tools/release/deployment-url.txt
      - name: Check deployment identity and the stable Production catalogue
        if: github.event_name == 'push'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run release:verify
      - name: Upload the public release result
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: .tools/release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
