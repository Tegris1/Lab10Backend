name: Lab 10 CI/CD

on:
  push:
    branches: [main, lab10]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_test:
        description: 'Deliberately fail a test to demonstrate that deployment is blocked'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests, build and basket E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shop_lab08_ci
          POSTGRES_USER: shop_lab08
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop_lab08 -d shop_lab08_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # These credentials belong only to the disposable CI PostgreSQL service.
    env:
      DATABASE_URL: postgresql://shop_lab08:ci-only-password@localhost:5432/shop_lab08_ci
      TEST_DATABASE_URL: postgresql://shop_lab08:ci-only-password@localhost:5432/shop_lab08_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-github-actions
      BETTER_AUTH_URL: http://localhost:3000
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install the locked dependencies
        run: npm ci --include=dev
      - name: Demonstrate that a failed test blocks deployment
        if: github.event_name == 'workflow_dispatch' && inputs.fail_test
        run: npm run test:ci-gate:failure
      - name: Validate the Prisma schema
        run: npm run db:validate
      - name: Generate client, lint, test and build
        run: npm run ci:check
      - name: Locate Chrome for the basket browser test
        run: |
          browser_path="$(command -v google-chrome)"
          echo "BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Test the basket on an isolated database
        id: cart_e2e
        run: npm run test:e2e:cart
      - name: Upload basket browser test results
        if: always() && steps.cart_e2e.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: cart-e2e-${{ github.sha }}
          path: .tools/cart-e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy to Vercel Production
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: production
      cancel-in-progress: false
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy the verified source to Vercel
        id: publish
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the production environment secrets}"
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in the production environment secrets}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in the production environment secrets}"
          mkdir -p .tools/release
          npx --yes vercel@65.3.1 deploy --prod --yes --meta githubCommitSha="$GITHUB_SHA" --token="$VERCEL_TOKEN" > .tools/release/deployment-url.txt
          echo "Published verified commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat .tools/release/deployment-url.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the deployment URL
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: .tools/release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
